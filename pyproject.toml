[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYsolver"
version = "0.4.0"
description = "Qualified beam and shell finite-element solver"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "threadpoolctl>=3.5",
  "ANYmaterial>=0.1,<0.2",
  "ANYmesher>=0.1,<0.4",
  "ANYfileio>=0.1,<0.3",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]
pardiso = ["pypardiso>=0.4"]
accelerated = ["numba>=0.59", "pypardiso>=0.4"]
dev = [
  "build>=1.2",
  "mpmath==1.3.0",
  "pytest>=8",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/audunarn/ANYsolver"
Repository = "https://github.com/audunarn/ANYsolver"
Issues = "https://github.com/audunarn/ANYsolver/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anysolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "-p", "no:cacheprovider"]
filterwarnings = [
  "ignore:Legacy four-node ShellElement is a temporary rollback path:DeprecationWarning",
]
