name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - run: python scripts/check_license_compliance.py

  resolver:
    name: Coordinated PyPI resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Resolve the coordinated release wheels
        run: >-
          python -m pip install --dry-run --only-binary=:all:
          dist/*.whl ANYmaterial==0.2.0 ANYmesher==0.4.0 ANYfileio==0.3.1

  pytest:
    runs-on: ${{ matrix.os }}
    # The portable coordinator applies a 20-minute test budget.  Retain an
    # outer runner deadline so a failed child-process cleanup cannot hold a
    # hosted runner indefinitely.
    timeout-minutes: 30
    env:
      Q1M_ANYMATERIAL_ROOT: ${{ github.workspace }}/.ecosystem/ANYmaterial
      Q1M_ANYGEOMETRY_ROOT: ${{ github.workspace }}/.ecosystem/ANYgeometry
      Q1M_ANYMESH_ROOT: ${{ github.workspace }}/.ecosystem/ANYmesh
      Q1M_ANYFILEIO_ROOT: ${{ github.workspace }}/.ecosystem/ANYfileIO
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: "3.11", shard-index: 0}
          - {os: ubuntu-latest, python-version: "3.11", shard-index: 1}
          - {os: windows-latest, python-version: "3.12", shard-index: 2}
          - {os: ubuntu-latest, python-version: "3.12", shard-index: 3}
          - {os: windows-latest, python-version: "3.13", shard-index: 4}
          - {os: ubuntu-latest, python-version: "3.13", shard-index: 5}
          - {os: windows-latest, python-version: "3.14", shard-index: 6}
          - {os: ubuntu-latest, python-version: "3.14", shard-index: 7}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: dd954f088a4cb95e267280cc4777b09e16232bd9
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 27e428188a891705288fef82bab0b166e330aff2
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install -e ".[dev,numba]"
      - run: python -m pip check
      - run: python -c "import anysolver; print(anysolver.__version__)"
      # The accepted S3/Q4 burn-in runner is immutable, machine-bound evidence.
      # Ordinary CI uses the current portable inventory and does not reopen it.
      - run: >-
          python scripts/run_portable_ci.py --workers 2 --timeout-seconds 1200
          --matrix-shard-index ${{ matrix.shard-index }} --matrix-shard-count 8

  anymesher-compatibility:
    name: ANYmesher ${{ matrix.anymesher-version }} compatibility
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - anymesher-version: "0.4.0"
            anymesher-ref: 27e428188a891705288fef82bab0b166e330aff2
            anygeometry-version: "0.4.2"
            anygeometry-ref: dd954f088a4cb95e267280cc4777b09e16232bd9
            anyfileio-version: "0.3.1"
            anyfileio-ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
            anyfileio-install: .ecosystem/ANYfileIO

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: ${{ matrix.anyfileio-ref }}
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: ${{ matrix.anygeometry-ref }}
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: ${{ matrix.anymesher-ref }}
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Build the ANYsolver wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m pip install numpy scipy threadpoolctl
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry .ecosystem/ANYmesh "${{ matrix.anyfileio-install }}"
          python -m pip check
          python -m build --wheel
      - name: Probe the installed endpoint outside the checkout
        shell: pwsh
        env:
          EXPECTED_ANYSOLVER_VERSION: "0.4.1"
          EXPECTED_ANYMATERIAL_VERSION: "0.2.0"
          EXPECTED_ANYMESHER_VERSION: ${{ matrix.anymesher-version }}
          EXPECTED_ANYGEOMETRY_VERSION: ${{ matrix.anygeometry-version }}
          EXPECTED_ANYFILEIO_VERSION: ${{ matrix.anyfileio-version }}
        run: |
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*.whl' -File)
          if ($wheel.Count -ne 1) { throw "Expected one ANYsolver wheel, found $($wheel.Count)" }
          python -m pip install $wheel[0].FullName
          python -m pip check
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE\tests\test_anymesher_version_compatibility.py" --probe --metadata-mode installed
          } finally {
            Pop-Location
          }

  anyfileio-compatibility:
    name: ANYfileio ${{ matrix.anyfileio-version }} compatibility
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - anyfileio-version: "0.3.1"
            anyfileio-ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
            anyfileio-install: .ecosystem/ANYfileIO
            anymesher-version: "0.4.0"
            anymesher-ref: 27e428188a891705288fef82bab0b166e330aff2
            anygeometry-version: "0.4.2"
            anygeometry-ref: dd954f088a4cb95e267280cc4777b09e16232bd9

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: ${{ matrix.anygeometry-ref }}
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: ${{ matrix.anymesher-ref }}
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: ${{ matrix.anyfileio-ref }}
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Build the ANYsolver wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m pip install numpy scipy threadpoolctl
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry .ecosystem/ANYmesh "${{ matrix.anyfileio-install }}"
          python -m pip check
          python -m build --wheel
      - name: Probe the installed endpoint outside the checkout
        shell: pwsh
        env:
          EXPECTED_ANYSOLVER_VERSION: "0.4.1"
          EXPECTED_ANYMATERIAL_VERSION: "0.2.0"
          EXPECTED_ANYFILEIO_VERSION: ${{ matrix.anyfileio-version }}
          EXPECTED_ANYMESHER_VERSION: ${{ matrix.anymesher-version }}
          EXPECTED_ANYGEOMETRY_VERSION: ${{ matrix.anygeometry-version }}
        run: |
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*.whl' -File)
          if ($wheel.Count -ne 1) { throw "Expected one ANYsolver wheel, found $($wheel.Count)" }
          python -m pip install $wheel[0].FullName
          python -m pip check
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE\tests\test_anyfileio_version_compatibility.py" --probe --metadata-mode installed
          } finally {
            Pop-Location
          }

  wheel:
    name: Wheel smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: dd954f088a4cb95e267280cc4777b09e16232bd9
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 27e428188a891705288fef82bab0b166e330aff2
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install and resolve current siblings
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry .ecosystem/ANYmesh .ecosystem/ANYfileIO
          python -m pip check
      - name: Build and check distributions
        run: |
          python -m build
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *glob.glob('dist/*')])"
      - name: Install wheel and pinned siblings into a clean target
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--target', '.wheel-smoke', '.ecosystem/ANYmaterial',
          '.ecosystem/ANYgeometry', '.ecosystem/ANYmesh', '.ecosystem/ANYfileIO',
          *glob.glob('dist/*.whl')])"
      - name: Import the installed wheel without site packages
        run: >-
          python -S -c "import sys; from importlib.metadata import version;
          from pathlib import Path; sys.path.insert(0,
          str(Path('.wheel-smoke').resolve())); import anysolver;
          from anysolver import Material, StiffenerCrossSection;
          from anysolver.sesam_fem import SesamFemDocument;
          assert anysolver.__version__ == version('ANYsolver');
          assert Material.__module__.startswith('anymaterial.');
          assert StiffenerCrossSection.__module__.startswith('anymesher.');
          assert SesamFemDocument.__module__.startswith('anyfileio.');
          print('wheel import OK', anysolver.__version__)"

  numba:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: dd954f088a4cb95e267280cc4777b09e16232bd9
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 27e428188a891705288fef82bab0b166e330aff2
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install -e ".[dev,numba]"
      - run: python -m pip check
      - run: python -m pytest tests/test_batch_b_activation.py tests/test_nonlinear_performance_batch_b.py tests/test_nonlinear_performance_batch_c.py

  pardiso:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: dd954f088a4cb95e267280cc4777b09e16232bd9
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 27e428188a891705288fef82bab0b166e330aff2
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: b48ba51c7b79e6d64b3f99c1fb131b9b602e7e1d
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install -e ".[dev,pardiso]"
      - run: python -m pip check
      - run: python -c "import pypardiso"
      - run: python -m pytest tests/test_fe_solver_infrastructure.py
