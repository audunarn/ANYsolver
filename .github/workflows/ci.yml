name: Physical replay diagnostic
on:
  workflow_dispatch:
jobs:
  capture:
    name: Original Windows 3.14 worker - logging only
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NUMBA_DISABLE_JIT: "0"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      ANYSOLVER_RUN_RETIRED_PROGRAMME_TESTS: "0"
      ANYSOLVER_GE_BEAM3_DEADLINE_SCALE: "4"
      PYTHONPATH: ${{ github.workspace }}/src
      Q1M_ANYMATERIAL_ROOT: ${{ github.workspace }}/.ecosystem/ANYmaterial
      Q1M_ANYGEOMETRY_ROOT: ${{ github.workspace }}/.ecosystem/ANYgeometry
      Q1M_ANYMESH_ROOT: ${{ github.workspace }}/.ecosystem/ANYmesh
      Q1M_ANYFILEIO_ROOT: ${{ github.workspace }}/.ecosystem/ANYfileIO
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: 91846898b03fa02b029abde82508eddb981efdc0
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 2ccef378c3efb4ba3a9957b9ab896ac8fc454b9d
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: db73950018e1c87dab0ca618c25c965030ba08ce
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO -e ".[dev,numba]"
          numpy==2.5.4 scipy==1.18.1 numba==0.68.0 llvmlite==0.50.0
          pytest==9.1.1 threadpoolctl==3.7.0 pywin32
      - run: python -m pip check
      - name: Confirm unchanged numerical source and tests
        shell: pwsh
        run: |
          $changed = git diff 1e0102033b3f181e0c5dc8dfce11a493fe06302d HEAD -- src tests
          if ($changed) { throw "Diagnostic branch changed numerical source or tests" }
          # Preserve the original worker's repository metadata inputs as well.
          $originalWorkflow = git show 1e0102033b3f181e0c5dc8dfce11a493fe06302d:.github/workflows/ci.yml
          [IO.File]::WriteAllText(".github/workflows/ci.yml", ($originalWorkflow -join "`n")+"`n")
      - name: Replay original worker and capture physical intermediates
        env:
          PHYSICAL_CAPTURE_OUTPUT: ${{ runner.temp }}/physical-capture
        timeout-minutes: 7
        run: python scripts/ci_physical_capture.py
      - name: Preserve logging-only output even on expected replay failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-replay-capture
          retention-days: 3
          path: |
            ${{ runner.temp }}/physical-capture/physical-capture.json
            ${{ runner.temp }}/physical-capture/progress.json
          if-no-files-found: warn
