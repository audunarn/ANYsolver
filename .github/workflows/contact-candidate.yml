name: Contact candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contact-candidate.yml
      - scripts/build_static_contact_candidate.py
      - scripts/check_static_contact_candidate.py
      - scripts/contact_candidate_slice2.json
      - tests/test_static_contact_candidate_tools.py
      - docs/GENERAL_CONTACT_STATIC_CANDIDATE.md
      - src/anysolver/**
      - packages/results/pyproject.toml
      - pyproject.toml
      - examples/**
      - tests/test_general_contact_*.py
  pull_request:
    paths:
      - .github/workflows/contact-candidate.yml
      - scripts/build_static_contact_candidate.py
      - scripts/check_static_contact_candidate.py
      - scripts/contact_candidate_slice2.json
      - tests/test_static_contact_candidate_tools.py
      - docs/GENERAL_CONTACT_STATIC_CANDIDATE.md
      - src/anysolver/**
      - packages/results/pyproject.toml
      - pyproject.toml
      - examples/**
      - tests/test_general_contact_*.py
  workflow_dispatch:

env:
  ANYMESHER_DISABLE_NATIVE: "1"
  ANYMESHER_REQUIRE_NATIVE: "0"

jobs:
  build:
    name: Build the six-wheel candidate bundle once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: 91846898b03fa02b029abde82508eddb981efdc0
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: 2ccef378c3efb4ba3a9957b9ab896ac8fc454b9d
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: db73950018e1c87dab0ca618c25c965030ba08ce
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Build the candidate bundle from the current checkout and pinned siblings
        run: >-
          python scripts/build_static_contact_candidate.py
          --output "${{ runner.temp }}/contact-candidate-s2"
          --sibling-root .ecosystem --results-root packages/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contact-candidate-bundle
          path: ${{ runner.temp }}/contact-candidate-s2/

  windows:
    name: Windows installed candidate checks
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Adapter supervision dependency before any adapter launch
        run: python -m pip install "psutil>=5.9"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contact-candidate-bundle
          path: ${{ runner.temp }}/bundle
      - name: Cold install of the same wheel bytes into a fresh venv
        run: >-
          python scripts/check_static_contact_candidate.py install
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-win"
          --venv "${{ runner.temp }}/venv-win"
      - name: Package and example origins before any solver run
        run: >-
          python scripts/check_static_contact_candidate.py origins
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-win"
          --venv "${{ runner.temp }}/venv-win"
      - name: Exact selected assertions, staged lifecycle and example commands
        run: >-
          python scripts/check_static_contact_candidate.py run
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-win"
          --venv "${{ runner.temp }}/venv-win" --tests-root "${{ github.workspace }}"
          --budget-file "${{ runner.temp }}/budget-win.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-candidate-evidence-windows
          path: ${{ runner.temp }}/check-win/

  ubuntu:
    name: Ubuntu installed candidate checks and cross-host parity
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Adapter supervision dependency before any adapter launch
        run: python -m pip install "psutil>=5.9"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contact-candidate-bundle
          path: ${{ runner.temp }}/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contact-candidate-evidence-windows
          path: ${{ runner.temp }}/windows
      - name: Cold install of the same wheel bytes into a fresh venv
        run: >-
          python scripts/check_static_contact_candidate.py install
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-linux"
          --venv "${{ runner.temp }}/venv-linux"
      - name: Package and example origins before any solver run
        run: >-
          python scripts/check_static_contact_candidate.py origins
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-linux"
          --venv "${{ runner.temp }}/venv-linux"
      - name: Exact selected assertions, staged lifecycle and example commands
        run: >-
          python scripts/check_static_contact_candidate.py run
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-linux"
          --venv "${{ runner.temp }}/venv-linux" --tests-root "${{ github.workspace }}"
          --budget-file "${{ runner.temp }}/budget-linux.json"
      - name: Portable restart from the transferred Windows checkpoints
        run: >-
          python scripts/check_static_contact_candidate.py run
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/check-linux-transferred"
          --venv "${{ runner.temp }}/venv-linux" --tests-root "${{ github.workspace }}"
          --stages active-resume,resume
          --evidence-dir "${{ runner.temp }}/windows/evidence"
          --results-dir "${{ runner.temp }}/check-linux-transferred/results"
          --budget-file "${{ runner.temp }}/budget-linux.json"
      - name: Cross-host compact primary quantities under the adopted bound
        run: >-
          python scripts/check_static_contact_candidate.py compare
          --bundle "${{ runner.temp }}/bundle" --output "${{ runner.temp }}/compare-out"
          --reference "${{ runner.temp }}/windows/evidence"
          --candidate "${{ runner.temp }}/check-linux/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-candidate-evidence-ubuntu
          path: ${{ runner.temp }}/check-linux/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-candidate-evidence-ubuntu-transferred
          path: ${{ runner.temp }}/check-linux-transferred/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-candidate-cross-host-comparison
          path: ${{ runner.temp }}/compare-out/
